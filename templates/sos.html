<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SOS — Recovery Hub</title>
<style>
    body { background: #0F1117; color: #E5E7EB; font-family: system-ui, sans-serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; height: 80vh; }
    .container { max-width: 600px; background: #171A23; padding: 40px; border-radius: 12px; box-shadow: 0 4px 25px rgba(239,68,68,0.3); border: 2px solid #EF4444; text-align: center; }
    h1 { color: #EF4444; font-size: 2.2em; margin-top: 0; }
    .tip-box { background: #1F2937; padding: 25px; border-radius: 8px; margin: 20px 0; font-size: 1.2em; line-height: 1.5; color: #F3F4F6; }
    .btn { background: #F59E0B; color: #0F1117; font-weight: bold; padding: 15px 30px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; font-size: 1em; margin-top: 20px; }
    .btn:hover { background: #D97706; }
</style>
</head>
<body>
<div class="container">
    <h1>{{ tip.title }}</h1>
    <div class="tip-box">
        {{ tip.text }}
    </div>
    <p style="color: #9CA3AF;">Держись, братан. Этот шторм скоро пройдет.</p>
    <a href="/" class="btn">🛡️ Вернуться на главную (Я справился)</a>
</div>
</body>
</html>
